<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Bossing 3D Hub</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { background-color: var(--tg-theme-bg-color, #0f172a); color: var(--tg-theme-text-color, #f8fafc); font-family: -apple-system, sans-serif; }
    input, select { background-color: var(--tg-theme-secondary-bg-color, #1e293b); color: var(--tg-theme-text-color, #ffffff); border-color: #334155; }
    .tab-content { display: none; }
    .tab-content.active { display: block; }
  </style>
</head>
<body class="p-3 pb-24 select-none">

  <!-- Header -->
  <div class="mb-4 text-center">
    <h1 class="text-xl font-extrabold text-blue-500 uppercase tracking-widest">Bossing 3D</h1>
  </div>

  <div id="loading" class="text-center py-10 text-slate-400 animate-pulse">Syncing with Google Sheets...</div>

  <!-- VIEWS -->
  <div id="app-content" class="hidden">
    
    <!-- TAB 1: LOG JOB (Your existing form, compacted) -->
    <div id="view-log" class="tab-content active space-y-4">
      <div class="bg-slate-800 p-4 rounded-xl border border-slate-700 space-y-2">
        <label class="block text-xs text-slate-300">Item Name</label>
        <input type="text" id="itemName" class="w-full border rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-blue-500">
        <div class="grid grid-cols-2 gap-2 mt-2">
          <select id="jobType" class="border rounded-lg px-2 py-2 text-xs"><option value="Commercial">Commercial</option><option value="Personal / Giveaway">Giveaway</option><option value="Failed / Reject">Failed</option></select>
          <select id="printerId" class="border rounded-lg px-2 py-2 text-xs"></select>
        </div>
        <div class="grid grid-cols-2 gap-2">
          <input type="number" id="printHours" placeholder="Hours" class="border rounded-lg px-2 py-2 text-xs">
          <input type="number" id="cashInflow" placeholder="Inflow (₱)" class="border rounded-lg px-2 py-2 text-xs">
        </div>
      </div>
      <div class="bg-slate-800 p-4 rounded-xl border border-slate-700 space-y-2">
        <h2 class="text-xs font-bold text-slate-400">FILAMENT & HARDWARE</h2>
        <div class="flex gap-2"><select id="spool1" class="flex-1 border rounded-lg px-2 py-2 text-xs"></select><input type="number" id="g1" placeholder="g" class="w-16 border rounded-lg px-2 py-2 text-xs text-center"></div>
        <div class="flex gap-2"><select id="hw1" class="flex-1 border rounded-lg px-2 py-2 text-xs"></select><input type="number" id="qty1" placeholder="Qty" class="w-16 border rounded-lg px-2 py-2 text-xs text-center"></div>
      </div>
      <button onclick="submitJob()" id="submitBtn" class="w-full py-3 bg-blue-600 text-white font-bold rounded-xl active:scale-95 transition">Log Job & Deduct</button>
    </div>

    <!-- TAB 2: CALCULATOR -->
    <div id="view-calc" class="tab-content space-y-4">
      <div class="bg-slate-800 p-4 rounded-xl border border-slate-700 space-y-3">
        <h2 class="text-sm font-bold text-blue-400">Cost Estimator</h2>
        <div class="grid grid-cols-2 gap-2">
          <select id="calc-printer" class="border rounded-lg px-2 py-2 text-xs" onchange="runCalc()"></select>
          <input type="number" id="calc-hours" placeholder="Hours" class="border rounded-lg px-2 py-2 text-xs" oninput="runCalc()">
        </div>
        <div class="flex gap-2">
          <select id="calc-spool" class="flex-1 border rounded-lg px-2 py-2 text-xs" onchange="runCalc()"></select>
          <input type="number" id="calc-g" placeholder="Grams" class="w-20 border rounded-lg px-2 py-2 text-xs" oninput="runCalc()">
        </div>
        <div class="flex gap-2">
          <select id="calc-hw" class="flex-1 border rounded-lg px-2 py-2 text-xs" onchange="runCalc()"></select>
          <input type="number" id="calc-qty" placeholder="Qty" class="w-20 border rounded-lg px-2 py-2 text-xs" oninput="runCalc()">
        </div>
        <div class="border-t border-slate-700 pt-3 mt-3">
          <div class="flex justify-between text-sm text-slate-300"><span>Production Cost:</span> <span id="calc-cost" class="font-bold text-white">₱0.00</span></div>
        </div>
        <div class="flex gap-2 items-center mt-2">
          <span class="text-xs text-slate-400">Target Margin:</span>
          <select id="calc-margin" class="border rounded-lg px-2 py-1 text-xs w-24" onchange="runCalc()">
            <option value="0.30">30%</option>
            <option value="0.50" selected>50%</option>
            <option value="0.70">70%</option>
          </select>
        </div>
        <div class="bg-slate-900 p-3 rounded-lg text-center border border-slate-700">
          <div class="text-xs text-slate-400">Suggested Selling Price</div>
          <div id="calc-price" class="text-2xl font-extrabold text-green-400">₱0.00</div>
        </div>
      </div>
    </div>

    <!-- TAB 3: INVENTORY -->
    <div id="view-inventory" class="tab-content space-y-4">
      <div class="bg-slate-800 p-4 rounded-xl border border-slate-700">
        <h2 class="text-sm font-bold text-blue-400 mb-2">Add New Spool</h2>
        <div class="grid grid-cols-2 gap-2 mb-2">
          <input type="text" id="newSpoolId" placeholder="ID (e.g. SPL-10)" class="border rounded-lg px-2 py-2 text-xs">
          <input type="text" id="newBrand" placeholder="Brand (e.g. eSUN)" class="border rounded-lg px-2 py-2 text-xs">
          <input type="text" id="newMaterial" placeholder="Material (PLA+)" class="border rounded-lg px-2 py-2 text-xs">
          <input type="text" id="newColor" placeholder="Color" class="border rounded-lg px-2 py-2 text-xs">
          <input type="number" id="newGrams" placeholder="Total (1000)" value="1000" class="border rounded-lg px-2 py-2 text-xs">
          <input type="number" id="newCost" placeholder="Cost (₱750)" class="border rounded-lg px-2 py-2 text-xs">
        </div>
        <button onclick="addSpool()" id="btn-add-spool" class="w-full py-2 bg-green-600 text-white text-xs font-bold rounded-lg active:scale-95">Save to Inventory</button>
      </div>
      <div id="spool-list" class="space-y-2"></div>
    </div>

    <!-- TAB 4: HISTORY -->
    <div id="view-history" class="tab-content space-y-2">
      <h2 class="text-xs font-bold text-slate-400 pl-2">Recent Prints (Tap X to Delete & Restore)</h2>
      <div id="history-list" class="space-y-2"></div>
    </div>

  </div>

  <!-- Bottom Navigation Bar -->
  <div class="fixed bottom-0 left-0 right-0 bg-slate-900 border-t border-slate-800 flex justify-around p-2 pb-4 text-xs text-slate-500">
    <button onclick="nav('log')" id="nav-log" class="flex-1 py-2 text-blue-400 font-bold">📝 Log</button>
    <button onclick="nav('calc')" id="nav-calc" class="flex-1 py-2 hover:text-blue-300">🧮 Calc</button>
    <button onclick="nav('inventory')" id="nav-inventory" class="flex-1 py-2 hover:text-blue-300">📦 Stock</button>
    <button onclick="nav('history')" id="nav-history" class="flex-1 py-2 hover:text-blue-300">📜 History</button>
  </div>

  <script>
    const API_URL = "https://script.google.com/macros/s/AKfycbyEVcZfVvYnBXX8Kbkhri9Ks_UNsqwRn9Gaqih22xsv-Snv3PAkhAo7ej0DKQXmJTFv/exec"; // <--- PASTE URL HERE
    
    let appData = {};

    async function init() {
      try {
        const res = await fetch(API_URL);
        appData = await res.json();
        
        // Populate Dropdowns
        populate("spool", appData.spools, s => `<option value="${s.id}" data-cost="${s.costPerGram}">${s.id} - ${s.color} [${Math.round(s.remaining)}g]</option>`);
        populate("hw", appData.hardware, h => `<option value="${h.id}" data-cost="${h.costPerUnit}">${h.name} [${h.remaining} left]</option>`);
        populate("printer", appData.printers, p => `<option value="${p.id}" data-depr="${p.deprRate}">${p.model}</option>`);
        
        // Render Inventory List
        document.getElementById("spool-list").innerHTML = appData.spools.map(s => 
          `<div class="bg-slate-800 p-3 rounded-lg border border-slate-700 flex justify-between">
            <div><div class="font-bold text-sm">${s.id}</div><div class="text-xs text-slate-400">${s.brand} ${s.color}</div></div>
            <div class="text-right"><div class="font-bold ${s.remaining < 150 ? 'text-red-400' : 'text-green-400'}">${Math.round(s.remaining)}g</div></div>
          </div>`).join("");

        // Render History List
        document.getElementById("history-list").innerHTML = appData.recentJobs.map(j => 
          `<div class="bg-slate-800 p-3 rounded-lg border border-slate-700 flex justify-between items-center">
            <div><div class="font-bold text-sm text-white">${j.item}</div><div class="text-xs text-slate-400">${new Date(j.date).toLocaleDateString()} • Inflow: ₱${j.inflow}</div></div>
            <button onclick="deleteLog('${j.logId}')" class="text-red-400 p-2 text-lg">✖</button>
          </div>`).join("");

        document.getElementById("loading").classList.add("hidden");
        document.getElementById("app-content").classList.remove("hidden");
      } catch (err) { alert("Failed to load: " + err.message); }
    }

    function populate(prefix, items, tmpl) {
      const opts = `<option value="">-- None --</option>` + items.map(tmpl).join("");
      ['1', ''].forEach(suffix => { if(document.getElementById(prefix+suffix)) document.getElementById(prefix+suffix).innerHTML = opts; });
      if(document.getElementById(`calc-${prefix}`)) document.getElementById(`calc-${prefix}`).innerHTML = opts;
    }

    // CALCULATOR LOGIC (Runs locally, instantly)
    function runCalc() {
      const sp = document.getElementById("calc-spool").selectedOptions[0];
      const hw = document.getElementById("calc-hw").selectedOptions[0];
      const pr = document.getElementById("calc-printer").selectedOptions[0];
      
      const g = Number(document.getElementById("calc-g").value) || 0;
      const qty = Number(document.getElementById("calc-qty").value) || 0;
      const hrs = Number(document.getElementById("calc-hours").value) || 0;
      const margin = Number(document.getElementById("calc-margin").value);

      const matCost = sp && sp.value ? g * Number(sp.dataset.cost) : 0;
      const hwCost = hw && hw.value ? qty * Number(hw.dataset.cost) : 0;
      const deprCost = pr && pr.value ? hrs * Number(pr.dataset.depr) : 0;
      const elecCost = hrs * 5; // Fixed 5 pesos/hr

      const totalCost = matCost + hwCost + deprCost + elecCost;
      const sellPrice = totalCost / (1 - margin);

      document.getElementById("calc-cost").innerText = `₱${totalCost.toFixed(2)}`;
      document.getElementById("calc-price").innerText = `₱${sellPrice.toFixed(2)}`;
    }

    // TAB NAVIGATION
    function nav(tabId) {
      document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
      document.querySelectorAll('[id^="nav-"]').forEach(el => { el.classList.remove('text-blue-400', 'font-bold'); el.classList.add('text-slate-500'); });
      document.getElementById('view-' + tabId).classList.add('active');
      document.getElementById('nav-' + tabId).classList.remove('text-slate-500');
      document.getElementById('nav-' + tabId).classList.add('text-blue-400', 'font-bold');
    }

    // API ACTIONS
    async function apiPost(payload, btnId) {
      const btn = document.getElementById(btnId);
      const original = btn.innerText;
      btn.innerText = "Saving..."; btn.disabled = true;
      try {
        await fetch(API_URL, { method: "POST", body: JSON.stringify(payload) });
        init(); // Refresh data
      } catch (err) { alert(err); }
      btn.innerText = original; btn.disabled = false;
    }

    function submitJob() {
      apiPost({
        action: "logPrint", itemName: document.getElementById("itemName").value, jobType: document.getElementById("jobType").value,
        printerId: document.getElementById("printerId").value, printHours: document.getElementById("printHours").value, cashInflow: document.getElementById("cashInflow").value,
        spool1: document.getElementById("spool1").value, g1: document.getElementById("g1").value, hw1: document.getElementById("hw1").value, qty1: document.getElementById("qty1").value
      }, "submitBtn");
    }

    function addSpool() {
      apiPost({
        action: "addSpool", spoolId: document.getElementById("newSpoolId").value, brand: document.getElementById("newBrand").value,
        material: document.getElementById("newMaterial").value, color: document.getElementById("newColor").value, 
        initialGrams: document.getElementById("newGrams").value, cost: document.getElementById("newCost").value
      }, "btn-add-spool");
    }

    async function deleteLog(logId) {
      if(confirm("Delete this log and restore inventory?")) {
        try { await fetch(API_URL, { method: "POST", body: JSON.stringify({ action: "deleteLog", logId: logId }) }); init(); } 
        catch (err) { alert(err); }
      }
    }

    init();
  </script>
</body>
</html>
